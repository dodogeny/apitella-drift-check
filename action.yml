name: "Apitella Drift Check"
description: "Poll an Apitella source and fail the build if schema drift or a failed assertion meets your severity threshold."
author: "Apitella"
branding:
  icon: "activity"
  color: "blue"

inputs:
  api-key:
    description: "Apitella API key (apt_live_...). Store this as a repo/org secret, never inline."
    required: true
  source-id:
    description: "The Apitella source UUID to poll. Found on the source's page, in the URL. Leave unset to auto-register from source-url instead."
    required: false
  source-url:
    description: "MCP or REST endpoint URL to monitor. Only used when source-id is unset: finds the existing source with this URL on your account, or creates one on first run."
    required: false
  source-name:
    description: "Display name for an auto-registered source. Defaults to source-url. Ignored if source-id is set."
    required: false
  source-type:
    description: "\"mcp\" or \"rest\", for an auto-registered source. Ignored if source-id is set."
    required: false
    default: "mcp"
  fail-on-severity:
    description: "Minimum severity that fails this step: breaking, risky, notable, or cosmetic."
    required: false
    default: "breaking"
  api-url:
    description: "Apitella API base URL. Override only for self-hosted or local testing."
    required: false
    default: "https://api.apitella.io/v1"

outputs:
  drifted:
    description: "\"true\" if this poll found any drift, assertion failure, security finding, or value-drift finding at all (regardless of severity)."
    value: ${{ steps.poll.outputs.drifted }}
  severity:
    description: "The severity found: breaking, risky, notable, cosmetic, or empty if nothing was detected."
    value: ${{ steps.poll.outputs.severity }}
  rate_limited:
    description: "\"true\" if this run hit the Free-plan on-demand poll limit and wasn't checked -- unset otherwise. Does not fail the step."
    value: ${{ steps.poll.outputs.rate_limited }}

runs:
  using: "composite"
  steps:
    - id: poll
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        SOURCE_ID: ${{ inputs.source-id }}
        SOURCE_URL: ${{ inputs.source-url }}
        SOURCE_NAME: ${{ inputs.source-name }}
        SOURCE_TYPE: ${{ inputs.source-type }}
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        API_URL: ${{ inputs.api-url }}
      run: bash "$GITHUB_ACTION_PATH/drift-check.sh"
